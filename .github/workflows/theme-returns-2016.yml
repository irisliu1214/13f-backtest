name: Fill 2016 theme returns
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "theme_returns_2016.py"
      - ".github/workflows/theme-returns-2016.yml"
      - "results/quant_theme_constituents.csv"
permissions:
  contents: write
jobs:
  returns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - run: python theme_returns_2016.py
      - name: Commit results
        run: |
          git config user.name "13f-theme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/*_2016.csv
          if ! git diff --cached --quiet; then
            git commit -m "Fill 2016 theme forward returns"
            git pull --rebase origin main
            git push
          fi
