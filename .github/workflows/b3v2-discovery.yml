name: Run B3 v2 strict semantic discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "b3_semantic_v2.py"
      - ".github/workflows/b3v2-discovery.yml"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install scikit-learn beautifulsoup4
      - name: Run B3 v2 blind discovery
        run: python b3_semantic_v2.py
      - name: Validate strict semantic outputs
        run: |
          python - <<'PY'
          import json, pandas as pd, re
          p=pd.read_csv("results/b3v2_picks_frozen.csv")
          c=pd.read_csv("results/b3v2_cluster_scores.csv")
          d=pd.read_csv("results/b3v2_document_audit.csv")
          m=json.load(open("results/b3v2_methodology.json"))
          assert m["forward_returns_used"] is False
          assert len(p)>=30 and len(c)>=50 and len(d)>=100
          bad=("return_","forward_return","spy_")
          cols=" ".join(list(p.columns)+list(c.columns)+list(d.columns)).lower()
          assert not any(x in cols for x in bad)
          print("rows",len(p),"invest",int((p.decision=="INVEST").sum()))
          print("usable strict business docs",int(d.usable_text.sum()),"of",len(d))
          print(p[["quarter","decision","cluster_id","auto_terms","selected_tickers"]].to_string(index=False))
          PY
      - name: Commit B3 v2 frozen outputs
        run: |
          git config user.name "13f-b3v2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/b3v2_*.csv results/b3v2_methodology.json
          if ! git diff --cached --quiet; then
            git commit -m "Freeze B3 v2 selections before returns"
            git pull --rebase origin main
            git push
          fi
