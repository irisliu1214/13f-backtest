name: Run B3 v2 strict semantic discovery (manual fallback)

on:
  workflow_dispatch:

concurrency:
  group: b3v2-discovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install scikit-learn beautifulsoup4
      - name: Run B3 v2 blind discovery
        run: python b3_semantic_v2.py
      - name: Validate strict semantic outputs
        run: |
          python - <<'PY'
          import json, pandas as pd, re
          p=pd.read_csv("results/b3v2_picks_frozen.csv")
          c=pd.read_csv("results/b3v2_cluster_scores.csv")
          d=pd.read_csv("results/b3v2_document_audit.csv")
          m=json.load(open("results/b3v2_methodology.json"))
          assert m["forward_returns_used"] is False
          invest=p[p.decision.eq("INVEST")]
          assert len(p)>=30 and len(c)>=50 and len(d)>=100
          assert len(invest)>=5
          ud=d[d.usable_text.eq(True)]
          assert ud.form.isin(["10-K","20-F"]).all()
          print("rows",len(p),"invest",len(invest),"usable docs",int(d.usable_text.sum()))
          PY
      - name: Commit B3 v2 frozen outputs
        run: |
          git config user.name "13f-b3v2-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add results/b3v2_*.csv results/b3v2_methodology.json
          if ! git diff --cached --quiet; then
            git commit -m "Freeze B3 v2 validated selections before returns"
            git push
          fi
