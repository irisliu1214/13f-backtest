name: Run 13F backtest

on:
  workflow_dispatch:
    inputs:
      primary_floor_shares:
        description: "Minimum absolute share change for Percentage+floor"
        required: false
        default: "1000000"
  push:
    branches: [main]
    paths:
      - "backtest.py"
      - "requirements.txt"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PRIMARY_FLOOR_SHARES: ${{ github.event.inputs.primary_floor_shares || '1000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: python backtest.py
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: 13f-backtest-results
          path: results/
          retention-days: 30
      - name: Commit compact result files
        run: |
          git config user.name "13f-backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m "Update 13F backtest results"
            git push
          fi
