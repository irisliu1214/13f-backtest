name: Evaluate frozen B4 v2 returns

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/b4v2-returns.yml"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Confirm frozen picks exist
        run: |
          python -c "import pandas as pd; p=pd.read_csv('results/b4v2_picks_frozen.csv'); print('INVEST',int((p.decision=='INVEST').sum()),'quarters',len(p)); assert len(p)==42"
      - name: Evaluate frozen B4 v2 selections
        run: python b4v2_returns.py
      - name: Validate outputs
        run: |
          python -c "import pandas as pd; s=pd.read_csv('results/b4v2_summary.csv'); q=pd.read_csv('results/b4v2_quarterly.csv'); c=pd.read_csv('results/b4v2_constituents.csv'); assert set(s.horizon_days)=={90,180,365}; assert len(q)>0 and len(c)>0; print(s.to_string(index=False))"
      - name: Commit B4 v2 return outputs
        run: |
          git config user.name "13f-b4-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add results/b4v2_forward_returns.csv results/b4v2_constituents.csv results/b4v2_quarterly.csv results/b4v2_summary.csv
          if ! git diff --cached --quiet; then
            git commit -m "Evaluate frozen cached B4 selections"
            git push
          fi
