name: Run B4 causal-theme discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "b4_causal.py"
      - ".github/workflows/b4-causal.yml"

concurrency:
  group: b4-causal-discovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install scikit-learn beautifulsoup4
      - name: Static compile
        run: python -m py_compile b4_causal.py
      - name: Run blind B4 discovery
        run: python b4_causal.py
      - name: Validate no-return firewall and outputs
        run: |
          python - <<'PY'
          import json, pandas as pd
          p=pd.read_csv("results/b4_picks_frozen.csv")
          d=pd.read_csv("results/b4_driver_scores.csv")
          e=pd.read_csv("results/b4_driver_evidence.csv")
          a=pd.read_csv("results/b4_document_audit.csv")
          m=json.load(open("results/b4_methodology.json"))
          assert m["forward_returns_used"] is False
          assert m["prices_read"] is False
          assert len(p)>=30, len(p)
          assert len(a)>=100, len(a)
          cols=" ".join(map(str,list(p.columns)+list(d.columns)+list(e.columns)+list(a.columns))).lower()
          for bad in ["return_90","return_180","return_365","spy_","forward_return","entry_price","exit_price"]:
              assert bad not in cols, bad
          invest=p[p.decision.eq("INVEST")]
          print("quarters",len(p),"invest",len(invest),"drivers",len(d),"evidence",len(e),"docs",len(a))
          print(p.to_string(index=False))
          PY
      - name: Commit frozen B4 discovery outputs
        run: |
          git config user.name "13f-b4-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/b4_*.csv results/b4_methodology.json
          if ! git diff --cached --quiet; then
            git commit -m "Freeze B4 causal-theme selections before returns"
            git pull --rebase origin main
            git push
          fi