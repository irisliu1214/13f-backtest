name: Run B4 causal-theme discovery (legacy manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install scikit-learn beautifulsoup4
      - name: Static compile
        run: python -m py_compile b4_causal.py
      - name: Run legacy blind B4 discovery
        run: python b4_causal.py
